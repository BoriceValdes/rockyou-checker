name: CI

on:
  push:
    branches: ["main", "backend", "frontend", "importer"]
  pull_request:
    branches: ["main"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - run: ruff check .

      - run: mypy app

      - name: pytest
        run: |
          pytest
          code=$?
          if [ $code -eq 5 ]; then
            echo "Aucun test collecté (backend/tests/ est vide actuellement) — pas un échec."
            exit 0
          fi
          exit $code

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run test

  importer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: importer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - run: go build ./...
      - run: go vet ./...

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, importer]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rockyou-backend ./backend
      - run: docker build -t rockyou-frontend ./frontend
      - run: docker build -t rockyou-importer ./importer