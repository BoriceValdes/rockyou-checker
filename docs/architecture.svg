<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" role="img" aria-label="Le frontend React envoie le préfixe SHA-1 du mot de passe au backend FastAPI en HTTPS/JSON, qui interroge PostgreSQL en SQL via asyncpg et renvoie les suffixes candidats ; l'importeur Go charge en masse rockyou.txt dans PostgreSQL par COPY.">
  <title>Architecture rockyou-checker</title>
  <style>
    .box { fill: #ffffff; stroke: #1f2937; stroke-width: 1.5; }
    .label { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; fill: #1f2937; }
    .title { font-weight: 700; font-size: 15px; }
    .sub { font-size: 11.5px; fill: #4b5563; }
    .edge { stroke: #1f2937; stroke-width: 1.5; fill: none; }
    .edge-label { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; font-size: 11.5px; fill: #374151; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e293b; stroke: #cbd5e1; }
      .label { fill: #e2e8f0; }
      .sub { fill: #94a3b8; }
      .edge { stroke: #cbd5e1; }
      .edge-label { fill: #cbd5e1; }
    }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="label" />
    </marker>
  </defs>

  <!-- Frontend -->
  <rect class="box" x="30" y="130" width="210" height="110" rx="6"/>
  <text class="label title" x="135" y="160" text-anchor="middle">Frontend</text>
  <text class="label sub" x="135" y="180" text-anchor="middle">React + TypeScript</text>
  <text class="label sub" x="135" y="196" text-anchor="middle">Vite / Tailwind CSS</text>
  <text class="label sub" x="135" y="218" text-anchor="middle">SPA statique (nginx)</text>

  <!-- Backend -->
  <rect class="box" x="360" y="130" width="210" height="110" rx="6"/>
  <text class="label title" x="465" y="160" text-anchor="middle">Backend</text>
  <text class="label sub" x="465" y="180" text-anchor="middle">FastAPI (async)</text>
  <text class="label sub" x="465" y="196" text-anchor="middle">Python 3.12</text>
  <text class="label sub" x="465" y="218" text-anchor="middle">POST /api/v1/breach-check</text>

  <!-- PostgreSQL -->
  <rect class="box" x="690" y="130" width="200" height="110" rx="6"/>
  <text class="label title" x="790" y="160" text-anchor="middle">PostgreSQL 16</text>
  <text class="label sub" x="790" y="180" text-anchor="middle">breached_passwords</text>
  <text class="label sub" x="790" y="196" text-anchor="middle">index (préfixe, suffixe)</text>

  <!-- Importer -->
  <rect class="box" x="690" y="300" width="200" height="80" rx="6"/>
  <text class="label title" x="790" y="332" text-anchor="middle">Importer</text>
  <text class="label sub" x="790" y="352" text-anchor="middle">Go 1.22 / pgx</text>

  <!-- Frontend -> Backend -->
  <line class="edge" x1="240" y1="162" x2="360" y2="162" marker-end="url(#arrow)"/>
  <text class="edge-label" x="300" y="150" text-anchor="middle">HTTPS/JSON</text>
  <text class="edge-label" x="300" y="178" text-anchor="middle" font-size="10.5">préfixe SHA-1 (5 car.)</text>

  <!-- Backend -> Frontend -->
  <line class="edge" x1="360" y1="205" x2="240" y2="205" marker-end="url(#arrow)"/>
  <text class="edge-label" x="300" y="222" text-anchor="middle">suffixes candidats</text>

  <!-- Backend -> PostgreSQL -->
  <line class="edge" x1="570" y1="170" x2="690" y2="170" marker-end="url(#arrow)"/>
  <text class="edge-label" x="630" y="158" text-anchor="middle">SQL</text>
  <text class="edge-label" x="630" y="186" text-anchor="middle" font-size="10.5">asyncpg</text>

  <!-- PostgreSQL -> Backend -->
  <line class="edge" x1="690" y1="205" x2="570" y2="205" marker-end="url(#arrow)"/>
  <text class="edge-label" x="630" y="222" text-anchor="middle" font-size="10.5">lignes trouvées</text>

  <!-- Importer -> PostgreSQL -->
  <line class="edge" x1="790" y1="300" x2="790" y2="240" marker-end="url(#arrow)"/>
  <text class="edge-label" x="805" y="275" text-anchor="start">COPY</text>
  <text class="edge-label" x="805" y="290" text-anchor="start" font-size="10.5">(bulk)</text>

  <!-- k-anonymat note -->
  <text class="edge-label" x="135" y="270" text-anchor="middle" font-size="11" font-style="italic">calcule le SHA-1 localement</text>
  <text class="edge-label" x="135" y="286" text-anchor="middle" font-size="11" font-style="italic">(Web Crypto API)</text>
</svg>